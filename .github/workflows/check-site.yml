name: فحص الموقع

# يفحص الموقع المنشور على الدومين من خارج السيرفر (من بنية GitHub)
# ويعرض تقريراً كاملاً: DNS، HTTPS، الشهادة، الصفحات الرئيسية، وواجهة المواعيد.
#
# يُشغَّل عند الرفع برسالة تحتوي [check] أو يدوياً من تبويب Actions.

on:
  push:
    branches:
      - arena/01a08cd4-carsystem
  workflow_dispatch:

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: فحص الدومين والموقع
        run: |
          DOMAIN="carsys.easychat.cloud"
          echo "════════════════════════════════════"
          echo "   تقرير فحص الموقع: $DOMAIN"
          echo "   التاريخ: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "════════════════════════════════════"

          echo ""
          echo "── 1) سجلات DNS ──"
          getent hosts "$DOMAIN" || echo "  ✖ لا يوجد سجل DNS"

          echo ""
          echo "── 2) الصفحة الرئيسية (HTTPS) ──"
          HTTP=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "https://$DOMAIN/" 2>&1 || echo "000")
          echo "  كود الاستجابة: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "  ✅ الموقع يعمل"
            echo "  حجم الصفحة: $(wc -c < /tmp/home.html) بايت"
            echo "  العنوان: $(grep -o '<title>[^<]*</title>' /tmp/home.html | head -1)"
            echo "  اسم الورشة ظاهر: $(grep -c 'مركز الصيانة الذكي' /tmp/home.html || echo 0) مرة"
            echo "  معالج الحجز موجود: $(grep -c 'booking-wizard' /tmp/home.html || echo 0)"
          else
            echo "  ⚠️ الموقع لا يستجيب بشكل صحيح"
          fi

          echo ""
          echo "── 3) صفحة تسجيل الدخول ──"
          curl -sS -o /dev/null -w '  /login → HTTP %{http_code}\n' --max-time 20 "https://$DOMAIN/login" || true

          echo ""
          echo "── 4) صفحة تتبع الحجز ──"
          curl -sS -o /dev/null -w '  /track → HTTP %{http_code}\n' --max-time 20 "https://$DOMAIN/track" || true

          echo ""
          echo "── 5) واجهة المواعيد المتاحة ──"
          DATE=$(date -d '+3 days' +%F)
          BODY=$(curl -sS --max-time 20 "https://$DOMAIN/api/slots?date=$DATE&service=1" || echo '{}')
          echo "  الاستجابة: $(echo "$BODY" | head -c 220)"
          echo "  عدد المواعيد: $(echo "$BODY" | grep -o '"time"' | wc -l)"

          echo ""
          echo "── 6) حماية لوحة التحكم (يجب أن يحوّل لصفحة الدخول) ──"
          curl -sS -o /dev/null -w '  /admin → HTTP %{http_code} (تحويل: %{redirect_url})\n' --max-time 20 "https://$DOMAIN/admin" || true

          echo ""
          echo "── 7) شهادة SSL ──"
          echo | timeout 25 openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "  ⚠️ تعذّر قراءة الشهادة"

          echo ""
          echo "════════════════════════════════════"
          echo "   انتهى الفحص"
          echo "════════════════════════════════════"
